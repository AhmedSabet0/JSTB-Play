# Tests the server on every push to server/. The VM updates itself to every version that passed (server/auto-update.sh,
# a timer that setup-vm.sh installs, checks every 5 minutes); with the secrets below, this workflow also deploys
# right away over SSH. The VM keeps its own .env and database; they are never overwritten. Users' apps keep working
# during the restart (they retry their reports).
#
# Repository settings > Secrets and variables > Actions:
#   secret   SERVER_SSH_KEY   the VM's private SSH key (the whole file)
#   variable SERVER_HOST      the VM's IP, for example 145.241.153.177
#   variable SERVER_USER      ubuntu (default)
#   variable SERVER_URL       https://145-241-153-177.sslip.io (checked after the deploy)
name: Server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency: server-deploy

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python tests/test_server.py
      - run: python tests/test_data.py

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy set up?
        id: ready
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ vars.SERVER_HOST }}
        run: |
          if [ -z "$SERVER_SSH_KEY" ] || [ -z "$HOST" ]; then
            echo "::notice::The VM updates itself within 5 minutes (auto-update.sh). For an instant deploy, add the SERVER_SSH_KEY secret and the SERVER_HOST variable."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.ready.outputs.ok == 'yes'

      - name: SSH key
        if: steps.ready.outputs.ok == 'yes'
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -H "${{ vars.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy and restart
        if: steps.ready.outputs.ok == 'yes'
        run: |
          TARGET="${{ vars.SERVER_USER || 'ubuntu' }}@${{ vars.SERVER_HOST }}"
          tar -C server --exclude=.env --exclude='*.db' --exclude=__pycache__ --exclude=tests -czf server.tgz .
          scp -i ~/.ssh/id_vm server.tgz "$TARGET:/tmp/server.tgz"
          ssh -i ~/.ssh/id_vm "$TARGET" "SHA=$GITHUB_SHA bash -s" <<'EOS'
          set -e
          test -f ~/autoapply-server/.env || { echo "No ~/autoapply-server/.env on the VM: run setup-vm.sh there first (see README)."; exit 1; }
          tar -xzf /tmp/server.tgz -C ~/autoapply-server && rm /tmp/server.tgz
          cd ~/autoapply-server && sudo docker compose up -d --build --remove-orphans
          sudo docker compose up -d --no-deps --force-recreate app
          echo "$SHA" > .deployed
          sudo docker image prune -f >/dev/null
          sleep 5 && sudo docker compose ps
          EOS

      - name: Check the server
        if: steps.ready.outputs.ok == 'yes' && vars.SERVER_URL != ''
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "${{ vars.SERVER_URL }}/health"
